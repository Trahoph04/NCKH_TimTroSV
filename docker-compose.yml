name: nckh

services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nckh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nckh}
      POSTGRES_DB: ${POSTGRES_DB:-nckh}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nckh} -d ${POSTGRES_DB:-nckh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nckh}:${POSTGRES_PASSWORD:-nckh}@db:5432/${POSTGRES_DB:-nckh}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-true}
      ORS_API_KEY: ${ORS_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      MEDIA_DIR: /app/media
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media   # ảnh gửi trong chat (đã xoá EXIF) — xoá volume = xoá ảnh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api/app
          target: /app/app

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
      # chạy thử từ máy khác qua http://<IP>:3000 ⇒ cookie không được `secure`
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # chỉ đặt khi web/API ở 2 tên miền khác nhau (tunnel), vd. wss://xxx.trycloudflare.com/chat/ws
      CHAT_WS_URL: ${CHAT_WS_URL:-}
      # buổi thử nghiệm: random = /roommate xáo thẻ + ẩn % cho MỌI người (?mode= vẫn ghi đè)
      ROOMMATE_DECK_MODE: ${ROOMMATE_DECK_MODE:-ranked}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  media:
