name: nckh

services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nckh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nckh}
      POSTGRES_DB: ${POSTGRES_DB:-nckh}
    # chỉ máy chủ (psql/notebook trên host vẫn vào được): demo LAN mà mở 0.0.0.0 thì máy khác cùng WiFi đọc/ghi được
    # toàn DB bằng mật khẩu mặc định — api/web nói chuyện với db qua mạng docker, không cần cổng này
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nckh} -d ${POSTGRES_DB:-nckh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Redis không mật khẩu: ai PUBLISH vào chat:u:* là bơm được sự kiện chat giả ⇒ chỉ mở cho máy chủ
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      args:
        # torch + sentence-transformers cho chatbot (E5). false = image nhẹ, chatbot chỉ BM25
        INSTALL_ML: ${INSTALL_ML:-true}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nckh}:${POSTGRES_PASSWORD:-nckh}@db:5432/${POSTGRES_DB:-nckh}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-true}
      ORS_API_KEY: ${ORS_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      MEDIA_DIR: /app/media
      # chatbot (ADR-023) — mặc định trùng app/config.py; key Gemini chỉ đặt trong .env
      HF_HOME: /models
      CHATBOT_LLM_PROVIDER: ${CHATBOT_LLM_PROVIDER:-auto}
      CHATBOT_LEGAL_SCHEMA: ${CHATBOT_LEGAL_SCHEMA:-legal_ctu_v1}
      CHATBOT_AGENTS_ENABLED: ${CHATBOT_AGENTS_ENABLED:-false}
      CHATBOT_LLM_TIMEOUT_SECONDS: ${CHATBOT_LLM_TIMEOUT_SECONDS:-60}
      CHATBOT_LEGAL_TIMEOUT_SECONDS: ${CHATBOT_LEGAL_TIMEOUT_SECONDS:-180}
      CHATBOT_MAX_OUTPUT_TOKENS: ${CHATBOT_MAX_OUTPUT_TOKENS:-1024}
      CHATBOT_WARMUP_ENABLED: ${CHATBOT_WARMUP_ENABLED:-true}
      # Ollama chạy trên máy host (`ollama serve`), không trong compose: cần GPU/Metal của host
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media   # ảnh gửi trong chat (đã xoá EXIF) — xoá volume = xoá ảnh
      - models:/models     # cache model E5 (~470 MB) — xoá volume thì index_corpus tải lại
    # Linux không tự có host.docker.internal như Docker Desktop (Mac/Windows)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api/app
          target: /app/app

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
      # chạy thử từ máy khác qua http://<IP>:3000 ⇒ cookie không được `secure`
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # chỉ đặt khi web/API ở 2 tên miền khác nhau (tunnel), vd. wss://xxx.trycloudflare.com/chat/ws
      CHAT_WS_URL: ${CHAT_WS_URL:-}
      # buổi thử nghiệm: random = /roommate xáo thẻ + ẩn % cho MỌI người (?mode= vẫn ghi đè)
      ROOMMATE_DECK_MODE: ${ROOMMATE_DECK_MODE:-ranked}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  media:
  models:
